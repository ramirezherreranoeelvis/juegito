<!DOCTYPE html>
<html lang="es">
      <head>
            <meta charset="UTF-8" />
            <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
            />
            <title>Gatoso.io</title>
            <style>
                  @import url("https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap");

                  body {
                        margin: 0;
                        overflow: hidden;
                        background-color: #b6db66;
                        font-family: "Fredoka One", cursive;
                        user-select: none;
                  }

                  #gameCanvas {
                        display: block;
                  }

                  /* UI Layer */
                  #uiLayer {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        pointer-events: none;
                  }

                  /* Start Screen */
                  #startScreen {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0, 0, 0, 0.4);
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        pointer-events: auto;
                        z-index: 10;
                  }

                  .login-box {
                        background: #fff;
                        padding: 20px;
                        border-radius: 10px;
                        text-align: center;
                        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
                        width: 300px;
                  }

                  .login-box input {
                        width: 100%;
                        padding: 10px;
                        margin-bottom: 10px;
                        border: 2px solid #eee;
                        border-radius: 5px;
                        font-family: inherit;
                        box-sizing: border-box;
                        outline: none;
                  }

                  .btn {
                        background: #88cc44;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 5px;
                        cursor: pointer;
                        font-family: inherit;
                        font-size: 16px;
                        width: 100%;
                        box-shadow: 0 4px 0 #6bad2d;
                        transition: transform 0.1s;
                  }

                  .btn:active {
                        transform: translateY(4px);
                        box-shadow: none;
                  }

                  /* HUD */
                  #resources {
                        position: absolute;
                        bottom: 20px;
                        right: 20px;
                        display: none; /* Hidden until play */
                        flex-direction: column;
                        gap: 10px;
                  }

                  .res-box {
                        background: rgba(0, 0, 0, 0.3);
                        color: white;
                        padding: 8px 12px;
                        border-radius: 4px;
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        font-size: 18px;
                  }

                  .res-icon {
                        width: 24px;
                        height: 24px;
                        background: #ddd;
                        border-radius: 50%;
                        display: inline-block;
                  }

                  #actionBar {
                        position: absolute;
                        bottom: 20px;
                        left: 50%;
                        transform: translateX(-50%);
                        display: none;
                        gap: 8px;
                        pointer-events: auto;
                  }

                  .item-slot {
                        width: 50px;
                        height: 50px;
                        background: rgba(0, 0, 0, 0.2);
                        border-radius: 50%;
                        border: 4px solid rgba(0, 0, 0, 0.1);
                        cursor: pointer;
                        position: relative;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        transition: transform 0.1s;
                  }

                  .item-slot.active {
                        border-color: #ffd700;
                        background: rgba(0, 0, 0, 0.4);
                        transform: scale(1.1);
                  }

                  .slot-key {
                        position: absolute;
                        top: -5px;
                        left: -5px;
                        background: #333;
                        color: white;
                        width: 20px;
                        height: 20px;
                        border-radius: 50%;
                        font-size: 12px;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                  }

                  #stats {
                        position: absolute;
                        bottom: 100px; /* Above toolbar */
                        left: 50%;
                        transform: translateX(-50%);
                        width: 300px;
                        height: 10px;
                        background: rgba(0, 0, 0, 0.3);
                        border-radius: 5px;
                        display: none;
                        overflow: hidden;
                  }

                  #healthBar {
                        width: 100%;
                        height: 100%;
                        background: #ff5555;
                        transition: width 0.1s;
                  }

                  #scoreBoard {
                        position: absolute;
                        top: 20px;
                        right: 20px;
                        background: rgba(0, 0, 0, 0.2);
                        padding: 10px;
                        border-radius: 5px;
                        color: white;
                        display: none;
                        width: 150px;
                  }

                  .score-entry {
                        display: flex;
                        justify-content: space-between;
                        margin-bottom: 4px;
                        font-size: 14px;
                  }

                  #deathScreen {
                        display: none;
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0, 0, 0, 0.7);
                        justify-content: center;
                        align-items: center;
                        flex-direction: column;
                        color: white;
                        z-index: 20;
                        pointer-events: auto;
                  }
            </style>
      </head>
      <body>
            <canvas id="gameCanvas"></canvas>

            <div id="uiLayer">
                  <!-- Start Screen -->
                  <div id="startScreen">
                        <div class="login-box">
                              <h2>GatosoIO Clone</h2>
                              <input
                                    type="text"
                                    id="nickname"
                                    placeholder="Nickname"
                                    maxlength="12"
                              />
                              <button class="btn" onclick="startGame()">
                                    Enter Game
                              </button>
                              <p
                                    style="
                                          font-size: 12px;
                                          color: #888;
                                          margin-top: 10px;
                                    "
                              >
                                    WASD to Move, Click to Attack/Build<br />1-5
                                    to Select Items
                              </p>
                        </div>
                  </div>

                  <!-- Death Screen -->
                  <div id="deathScreen">
                        <h1>YOU DIED</h1>
                        <p id="finalScore">Score: 0</p>
                        <button
                              class="btn"
                              style="width: 200px"
                              onclick="location.reload()"
                        >
                              Respawn
                        </button>
                  </div>

                  <!-- Resources -->
                  <div id="resources">
                        <div class="res-box">
                              <div
                                    class="res-icon"
                                    style="background: #e0bb6b"
                              ></div>
                              <span id="woodCount">0</span>
                        </div>
                        <div class="res-box">
                              <div
                                    class="res-icon"
                                    style="background: #888"
                              ></div>
                              <span id="stoneCount">0</span>
                        </div>
                        <div class="res-box">
                              <div
                                    class="res-icon"
                                    style="background: #eebb33"
                              ></div>
                              <span id="foodCount">0</span>
                        </div>
                  </div>

                  <!-- Scoreboard -->
                  <div id="scoreBoard">
                        <div
                              style="
                                    text-align: center;
                                    margin-bottom: 5px;
                                    color: #ddd;
                              "
                        >
                              Leaderboard
                        </div>
                        <div id="scoreList"></div>
                  </div>

                  <!-- Health Bar -->
                  <div id="stats">
                        <div id="healthBar"></div>
                  </div>

                  <!-- Action Bar -->
                  <div id="actionBar">
                        <!-- Generated by JS -->
                  </div>
            </div>

            <script>
                  // --- Game Constants & Setup ---
                  const canvas = document.getElementById("gameCanvas");
                  const ctx = canvas.getContext("2d");

                  let width, height;
                  const MAP_SIZE = 2000;

                  function resize() {
                        width = window.innerWidth;
                        height = window.innerHeight;
                        canvas.width = width;
                        canvas.height = height;
                  }
                  window.addEventListener("resize", resize);
                  resize();

                  // --- Game State ---
                  let gameActive = false;
                  let lastTime = 0;
                  let camera = { x: 0, y: 0 };

                  // Input
                  const keys = {};
                  const mouse = { x: 0, y: 0, down: false, angle: 0 };

                  // Entities
                  let player = null;
                  let enemies = [];
                  let objects = []; // Trees, Rocks
                  let buildings = []; // Walls, Mills
                  let particles = [];
                  let damageTexts = [];

                  // Items Definitions
                  const ITEMS = {
                        AXE: {
                              id: 0,
                              name: "Axe",
                              type: "weapon",
                              range: 70,
                              dmg: 25,
                              speed: 300,
                              color: "#888",
                        },
                        FOOD: {
                              id: 1,
                              name: "Cookie",
                              type: "consumable",
                              heal: 30,
                              color: "#e6a86c",
                        },
                        WALL: {
                              id: 2,
                              name: "Wall",
                              type: "building",
                              cost: { wood: 30, stone: 0 },
                              hp: 200,
                              color: "#555",
                              radius: 25,
                        },
                        SPIKE: {
                              id: 3,
                              name: "Spike",
                              type: "building",
                              cost: { wood: 20, stone: 15 },
                              hp: 100,
                              dmg: 10,
                              color: "#333",
                              radius: 20,
                        },
                        MILL: {
                              id: 4,
                              name: "Mill",
                              type: "building",
                              cost: { wood: 50, stone: 50 },
                              hp: 150,
                              scoreGen: 1,
                              color: "#ffd700",
                              radius: 25,
                        },
                  };

                  const SLOT_MAP = [
                        ITEMS.AXE,
                        ITEMS.FOOD,
                        ITEMS.WALL,
                        ITEMS.SPIKE,
                        ITEMS.MILL,
                  ];

                  // --- Classes ---

                  class Entity {
                        constructor(x, y, radius, color) {
                              this.x = x;
                              this.y = y;
                              this.radius = radius;
                              this.color = color;
                              this.markedForDeletion = false;
                        }
                  }

                  class GameObject extends Entity {
                        constructor(x, y, type) {
                              // Type: 0 = Tree, 1 = Rock, 2 = Bush (Food)
                              super(
                                    x,
                                    y,
                                    type === 0 ? 50 : type === 1 ? 40 : 30,
                                    type === 0
                                          ? "#5e8544"
                                          : type === 1
                                          ? "#666"
                                          : "#69bc44"
                              );
                              this.type = type;
                              this.hp =
                                    type === 0 ? 100 : type === 1 ? 150 : 50;
                              this.maxHp = this.hp;
                              this.shake = 0;

                              // Visual variation
                              this.points = [];
                              if (type === 0 || type === 1) {
                                    let spikes = 7;
                                    for (let i = 0; i < spikes; i++) {
                                          let angle =
                                                ((Math.PI * 2) / spikes) * i;
                                          let r =
                                                this.radius *
                                                (0.8 + Math.random() * 0.4);
                                          this.points.push({
                                                x: Math.cos(angle) * r,
                                                y: Math.sin(angle) * r,
                                          });
                                    }
                              }
                        }

                        takeDamage(amt, isPlayer) {
                              this.hp -= amt;
                              this.shake = 10;
                              createDamageText(this.x, this.y, amt);
                              if (this.hp <= 0) {
                                    this.markedForDeletion = true;
                                    if (isPlayer) {
                                          if (this.type === 0)
                                                player.resources.wood +=
                                                      5 +
                                                      Math.floor(
                                                            Math.random() * 5
                                                      );
                                          if (this.type === 1)
                                                player.resources.stone +=
                                                      3 +
                                                      Math.floor(
                                                            Math.random() * 3
                                                      );
                                          if (this.type === 2)
                                                player.resources.food +=
                                                      1 +
                                                      Math.floor(
                                                            Math.random() * 2
                                                      );
                                          updateHUD();
                                    }
                                    createParticles(
                                          this.x,
                                          this.y,
                                          this.color,
                                          8
                                    );
                              } else if (isPlayer) {
                                    // Gather without destroying
                                    if (this.type === 0)
                                          player.resources.wood += 1;
                                    if (this.type === 1)
                                          player.resources.stone += 1;
                                    if (this.type === 2)
                                          player.resources.food += 1;
                                    updateHUD();
                              }
                        }

                        draw(ctx) {
                              ctx.save();
                              ctx.translate(
                                    this.x + (Math.random() - 0.5) * this.shake,
                                    this.y + (Math.random() - 0.5) * this.shake
                              );
                              if (this.shake > 0) this.shake *= 0.8;

                              if (this.type === 0 || this.type === 1) {
                                    // Irregular shape for trees/rocks
                                    ctx.fillStyle = this.color;
                                    ctx.beginPath();
                                    ctx.moveTo(
                                          this.points[0].x,
                                          this.points[0].y
                                    );
                                    for (let i = 1; i < this.points.length; i++)
                                          ctx.lineTo(
                                                this.points[i].x,
                                                this.points[i].y
                                          );
                                    ctx.closePath();
                                    ctx.fill();
                                    ctx.strokeStyle = "rgba(0,0,0,0.2)";
                                    ctx.lineWidth = 4;
                                    ctx.stroke();
                              } else {
                                    // Bush
                                    ctx.fillStyle = this.color;
                                    ctx.beginPath();
                                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                                    ctx.fill();
                              }
                              ctx.restore();
                        }
                  }

                  class Building extends Entity {
                        constructor(x, y, ownerId, config, angle) {
                              super(x, y, config.radius, config.color);
                              this.ownerId = ownerId;
                              this.hp = config.hp;
                              this.maxHp = config.hp;
                              this.type = config.name;
                              this.config = config;
                              this.angle = angle;
                              this.lastScoreTime = 0;
                        }

                        update(dt) {
                              if (this.type === "Mill" && gameActive) {
                                    if (
                                          Date.now() - this.lastScoreTime >
                                          1000
                                    ) {
                                          // Find owner
                                          if (
                                                player &&
                                                this.ownerId === player.id
                                          ) {
                                                player.score +=
                                                      this.config.scoreGen;
                                                createDamageText(
                                                      this.x,
                                                      this.y - 20,
                                                      "+" +
                                                            this.config
                                                                  .scoreGen,
                                                      "#ffd700"
                                                );
                                          } else {
                                                // Bot owner points (simulated)
                                                const bot = enemies.find(
                                                      (e) =>
                                                            e.id ===
                                                            this.ownerId
                                                );
                                                if (bot)
                                                      bot.score +=
                                                            this.config.scoreGen;
                                          }
                                          this.lastScoreTime = Date.now();
                                    }
                              }
                        }

                        draw(ctx) {
                              ctx.save();
                              ctx.translate(this.x, this.y);
                              ctx.rotate(this.angle);

                              // Shadow
                              ctx.fillStyle = "rgba(0,0,0,0.2)";
                              ctx.beginPath();
                              ctx.arc(4, 4, this.radius, 0, Math.PI * 2);
                              ctx.fill();

                              if (this.type === "Spike") {
                                    ctx.fillStyle = "#999";
                                    ctx.beginPath();
                                    for (let i = 0; i < 4; i++) {
                                          ctx.rotate(Math.PI / 2);
                                          ctx.moveTo(0, 0);
                                          ctx.lineTo(this.radius, -5);
                                          ctx.lineTo(this.radius, 5);
                                    }
                                    ctx.fill();
                                    ctx.beginPath();
                                    ctx.fillStyle = this.color;
                                    ctx.arc(
                                          0,
                                          0,
                                          this.radius / 2,
                                          0,
                                          Math.PI * 2
                                    );
                                    ctx.fill();
                              } else if (this.type === "Mill") {
                                    ctx.fillStyle = "#fff"; // Base
                                    ctx.beginPath();
                                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                                    ctx.fill();
                                    // Blades
                                    ctx.rotate(Date.now() / 500);
                                    ctx.fillStyle = this.color;
                                    for (let i = 0; i < 4; i++) {
                                          ctx.rotate(Math.PI / 2);
                                          ctx.fillRect(
                                                0,
                                                -5,
                                                this.radius * 1.8,
                                                10
                                          );
                                    }
                              } else {
                                    // Wall
                                    ctx.fillStyle = this.color;
                                    ctx.fillRect(
                                          -this.radius,
                                          -this.radius,
                                          this.radius * 2,
                                          this.radius * 2
                                    );
                                    ctx.strokeStyle = "#333";
                                    ctx.lineWidth = 2;
                                    ctx.strokeRect(
                                          -this.radius,
                                          -this.radius,
                                          this.radius * 2,
                                          this.radius * 2
                                    );
                              }

                              ctx.restore();
                        }
                  }

                  class Character extends Entity {
                        constructor(x, y, name, isBot = false) {
                              super(x, y, 35, "#e0b58c"); // Skin color
                              this.id = Math.random().toString(36).substr(2, 9);
                              this.name = name;
                              this.isBot = isBot;
                              this.angle = 0;
                              this.hp = 100;
                              this.maxHp = 100;
                              this.score = 0;
                              this.resources = { wood: 0, stone: 0, food: 0 };
                              this.itemIndex = 0;

                              this.attackTimer = 0;
                              this.isAttacking = false;
                              this.recoil = 0;
                        }

                        update(dt) {
                              if (this.hp <= 0) {
                                    this.markedForDeletion = true;
                                    createParticles(
                                          this.x,
                                          this.y,
                                          "#e00000",
                                          15
                                    );
                                    if (!this.isBot) gameOver();
                                    else {
                                          // Bot drop
                                          player.score +=
                                                Math.floor(this.score / 2) +
                                                100;
                                    }
                              }

                              // Recoil recovery
                              if (this.recoil > 0) this.recoil -= dt * 20;

                              // Attack Logic
                              if (this.isAttacking) {
                                    this.attackTimer += dt * 1000;
                                    const item = SLOT_MAP[this.itemIndex];
                                    if (
                                          this.attackTimer >= 150 &&
                                          this.attackTimer < 150 + dt * 1000
                                    ) {
                                          // Damage frame
                                          this.dealDamage();
                                    }
                                    if (this.attackTimer >= 300) {
                                          this.isAttacking = false;
                                          this.attackTimer = 0;
                                    }
                              }
                        }

                        dealDamage() {
                              const item = SLOT_MAP[this.itemIndex];
                              if (item.type !== "weapon") return;

                              // Hitbox location
                              const reach = item.range;
                              const hx = this.x + Math.cos(this.angle) * reach;
                              const hy = this.y + Math.sin(this.angle) * reach;

                              let hit = false;

                              // Check Trees/Rocks
                              objects.forEach((obj) => {
                                    if (
                                          Math.hypot(obj.x - hx, obj.y - hy) <
                                          obj.radius + 20
                                    ) {
                                          obj.takeDamage(item.dmg, !this.isBot);
                                          hit = true;
                                    }
                              });

                              // Check Buildings
                              if (!hit) {
                                    buildings.forEach((b) => {
                                          if (
                                                b.ownerId !== this.id &&
                                                Math.hypot(b.x - hx, b.y - hy) <
                                                      b.radius + 20
                                          ) {
                                                b.hp -= item.dmg;
                                                b.shake = 10; // Visual only
                                                createDamageText(
                                                      b.x,
                                                      b.y,
                                                      item.dmg
                                                );
                                                if (b.hp <= 0)
                                                      b.markedForDeletion = true;
                                                hit = true;
                                          }
                                    });
                              }

                              // Check Enemies/Player
                              if (!hit) {
                                    let targets = this.isBot
                                          ? [player]
                                          : enemies;
                                    targets.forEach((t) => {
                                          if (
                                                !t.markedForDeletion &&
                                                Math.hypot(t.x - hx, t.y - hy) <
                                                      t.radius + 20
                                          ) {
                                                t.hp -= item.dmg;
                                                t.recoil = 10;
                                                // Pushback
                                                t.x +=
                                                      Math.cos(this.angle) * 20;
                                                t.y +=
                                                      Math.sin(this.angle) * 20;
                                                createDamageText(
                                                      t.x,
                                                      t.y,
                                                      item.dmg
                                                );
                                                createParticles(
                                                      t.x,
                                                      t.y,
                                                      "#e00000",
                                                      5
                                                );
                                                hit = true;
                                                // Aggro bot
                                                if (!this.isBot && t.isBot)
                                                      t.target = this;
                                          }
                                    });
                              }
                        }

                        draw(ctx) {
                              ctx.save();
                              ctx.translate(this.x, this.y);
                              ctx.rotate(this.angle);

                              // Hands
                              ctx.fillStyle = "#333";
                              // Left Hand
                              ctx.beginPath();
                              ctx.arc(20, -20, 10, 0, Math.PI * 2);
                              ctx.fill();
                              // Right Hand (Action Hand)
                              let handOffset = 0;
                              let weaponRot = 0;

                              if (this.isAttacking) {
                                    handOffset =
                                          Math.sin(
                                                (this.attackTimer / 300) *
                                                      Math.PI
                                          ) * 20;
                                    weaponRot =
                                          -Math.sin(
                                                (this.attackTimer / 300) *
                                                      Math.PI
                                          ) * 2;
                              }

                              ctx.save();
                              ctx.translate(20 + handOffset, 20);

                              // Draw Item
                              const item = SLOT_MAP[this.itemIndex];
                              ctx.rotate(weaponRot);

                              if (item.type === "weapon") {
                                    ctx.fillStyle = item.color; // Axe color
                                    ctx.fillRect(0, -4, 40, 8); // Handle
                                    ctx.fillStyle = "#gold";
                                    // Axe Head
                                    ctx.beginPath();
                                    ctx.arc(35, 0, 15, 0, Math.PI * 2);
                                    ctx.fillStyle = "#999";
                                    ctx.fill();
                              } else if (item.type === "building") {
                                    // Draw mini building in hand
                                    ctx.fillStyle = item.color;
                                    ctx.fillRect(10, -10, 20, 20);
                              }

                              // Draw right hand circle
                              ctx.fillStyle = "#333";
                              ctx.beginPath();
                              ctx.arc(0, 0, 10, 0, Math.PI * 2);
                              ctx.fill();

                              ctx.restore();

                              // Body
                              ctx.fillStyle = this.color;
                              ctx.beginPath();
                              ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                              ctx.fill();
                              ctx.lineWidth = 3;
                              ctx.strokeStyle = "#333";
                              ctx.stroke();

                              ctx.restore();

                              // Health Bar and Name
                              ctx.fillStyle = "#fff";
                              ctx.font = "14px Fredoka One";
                              ctx.textAlign = "center";
                              ctx.fillText(this.name, this.x, this.y - 50);

                              ctx.fillStyle = "#444";
                              ctx.fillRect(this.x - 25, this.y - 45, 50, 6);
                              ctx.fillStyle = "#6bad2d";
                              ctx.fillRect(
                                    this.x - 25,
                                    this.y - 45,
                                    50 * (this.hp / this.maxHp),
                                    6
                              );
                        }
                  }

                  class Bot extends Character {
                        constructor() {
                              // Random position away from edges
                              let x = Math.random() * (MAP_SIZE - 200) + 100;
                              let y = Math.random() * (MAP_SIZE - 200) + 100;
                              const names = [
                                    "ProGamer",
                                    "NoobSlayer",
                                    "MooFan",
                                    "Guest_92",
                                    "FarmerJoe",
                              ];
                              super(
                                    x,
                                    y,
                                    names[
                                          Math.floor(
                                                Math.random() * names.length
                                          )
                                    ],
                                    true
                              );
                              this.target = null;
                              this.moveDir = Math.random() * Math.PI * 2;
                              this.moveTimer = 0;
                        }

                        update(dt) {
                              super.update(dt);
                              this.moveTimer -= dt;

                              // Simple AI Logic
                              let speed = 150;

                              if (
                                    this.target &&
                                    !this.target.markedForDeletion
                              ) {
                                    // Chase
                                    let dx = this.target.x - this.x;
                                    let dy = this.target.y - this.y;
                                    let dist = Math.hypot(dx, dy);
                                    this.angle = Math.atan2(dy, dx);

                                    if (dist > 100) {
                                          this.x +=
                                                Math.cos(this.angle) *
                                                speed *
                                                dt;
                                          this.y +=
                                                Math.sin(this.angle) *
                                                speed *
                                                dt;
                                    } else {
                                          // Attack
                                          if (!this.isAttacking)
                                                this.isAttacking = true;
                                    }
                              } else {
                                    // Wander
                                    if (this.moveTimer <= 0) {
                                          this.moveDir =
                                                Math.random() * Math.PI * 2;
                                          this.moveTimer =
                                                2 + Math.random() * 2;
                                          this.target = null;
                                    }
                                    this.angle = this.moveDir;
                                    this.x +=
                                          Math.cos(this.moveDir) *
                                          (speed * 0.5) *
                                          dt;
                                    this.y +=
                                          Math.sin(this.moveDir) *
                                          (speed * 0.5) *
                                          dt;

                                    // Boundary check
                                    if (
                                          this.x < 50 ||
                                          this.x > MAP_SIZE - 50 ||
                                          this.y < 50 ||
                                          this.y > MAP_SIZE - 50
                                    ) {
                                          this.moveDir += Math.PI;
                                    }

                                    // Look for player
                                    if (player && !player.markedForDeletion) {
                                          let d = Math.hypot(
                                                player.x - this.x,
                                                player.y - this.y
                                          );
                                          if (d < 300) this.target = player;
                                    }
                              }
                        }
                  }

                  // --- Core Functions ---

                  function initMap() {
                        objects = [];
                        buildings = [];
                        // Generate Trees
                        for (let i = 0; i < 40; i++) {
                              objects.push(
                                    new GameObject(
                                          Math.random() * MAP_SIZE,
                                          Math.random() * MAP_SIZE,
                                          0
                                    )
                              );
                        }
                        // Generate Rocks
                        for (let i = 0; i < 20; i++) {
                              objects.push(
                                    new GameObject(
                                          Math.random() * MAP_SIZE,
                                          Math.random() * MAP_SIZE,
                                          1
                                    )
                              );
                        }
                        // Generate Bushes
                        for (let i = 0; i < 15; i++) {
                              objects.push(
                                    new GameObject(
                                          Math.random() * MAP_SIZE,
                                          Math.random() * MAP_SIZE,
                                          2
                                    )
                              );
                        }
                        // Create Bots
                        enemies = [];
                        for (let i = 0; i < 5; i++) {
                              enemies.push(new Bot());
                        }
                  }

                  function startGame() {
                        const nick =
                              document.getElementById("nickname").value ||
                              "MooPlayer";
                        document.getElementById("startScreen").style.display =
                              "none";
                        document.getElementById("uiLayer").style.pointerEvents =
                              "none"; // Allow clicks to pass to canvas
                        document.getElementById("actionBar").style.display =
                              "flex";
                        document.getElementById("resources").style.display =
                              "flex";
                        document.getElementById("stats").style.display =
                              "block";
                        document.getElementById("scoreBoard").style.display =
                              "block";
                        document.getElementById("deathScreen").style.display =
                              "none";

                        // Setup Player
                        player = new Character(
                              MAP_SIZE / 2,
                              MAP_SIZE / 2,
                              nick
                        );
                        player.resources = { wood: 0, stone: 0, food: 0 };

                        // Build Action Bar UI
                        const bar = document.getElementById("actionBar");
                        bar.innerHTML = "";
                        SLOT_MAP.forEach((item, index) => {
                              const el = document.createElement("div");
                              el.className =
                                    "item-slot" +
                                    (index === 0 ? " active" : "");
                              el.innerHTML = `<div class="slot-key">${
                                    index + 1
                              }</div>`;

                              // Icon representation
                              const icon = document.createElement("div");
                              icon.style.width = "20px";
                              icon.style.height = "20px";
                              icon.style.background = item.color;
                              if (item.type === "weapon")
                                    icon.style.borderRadius = "2px";
                              else icon.style.borderRadius = "50%";

                              el.appendChild(icon);

                              // Click to select (Mobile support)
                              el.onclick = (e) => {
                                    e.stopPropagation(); // prevent game click
                                    selectItem(index);
                              };

                              bar.appendChild(el);
                        });

                        initMap();
                        gameActive = true;
                        lastTime = Date.now();
                        update();
                  }

                  function gameOver() {
                        gameActive = false;
                        document.getElementById("finalScore").innerText =
                              "Score: " + Math.floor(player.score);
                        document.getElementById("deathScreen").style.display =
                              "flex";
                        document.getElementById("uiLayer").style.pointerEvents =
                              "auto";
                  }

                  function selectItem(index) {
                        if (!player) return;
                        player.itemIndex = index;
                        // Update UI
                        const slots = document.querySelectorAll(".item-slot");
                        slots.forEach((s, i) => {
                              if (i === index) s.classList.add("active");
                              else s.classList.remove("active");
                        });
                  }

                  function createDamageText(x, y, text, color = "#fff") {
                        damageTexts.push({
                              x,
                              y,
                              text,
                              color,
                              alpha: 1,
                              life: 1,
                        });
                  }

                  function createParticles(x, y, color, count) {
                        for (let i = 0; i < count; i++) {
                              particles.push({
                                    x,
                                    y,
                                    vx: (Math.random() - 0.5) * 10,
                                    vy: (Math.random() - 0.5) * 10,
                                    life: 1,
                                    color,
                              });
                        }
                  }

                  // --- Main Loop ---

                  function update() {
                        if (!gameActive) return;
                        requestAnimationFrame(update);

                        const now = Date.now();
                        const dt = (now - lastTime) / 1000;
                        lastTime = now;

                        // --- Player Logic ---
                        // Input Movement
                        let dx = 0,
                              dy = 0;
                        if (keys["w"]) dy = -1;
                        if (keys["s"]) dy = 1;
                        if (keys["a"]) dx = -1;
                        if (keys["d"]) dx = 1;

                        if (dx !== 0 || dy !== 0) {
                              // Normalize speed
                              const speed = 200;
                              const len = Math.hypot(dx, dy);
                              dx /= len;
                              dy /= len;

                              let nextX = player.x + dx * speed * dt;
                              let nextY = player.y + dy * speed * dt;

                              // Simple collision w/ objects & buildings
                              let collided = false;

                              // Helper collision
                              const checkColl = (arr) => {
                                    for (let o of arr) {
                                          if (o.type === 2) continue; // Walk over food bush
                                          if (
                                                Math.hypot(
                                                      nextX - o.x,
                                                      nextY - o.y
                                                ) <
                                                player.radius + o.radius
                                          ) {
                                                return true;
                                          }
                                    }
                                    return false;
                              };

                              if (
                                    !checkColl(objects) &&
                                    !checkColl(buildings)
                              ) {
                                    // Map Boundaries
                                    player.x = Math.max(
                                          50,
                                          Math.min(MAP_SIZE - 50, nextX)
                                    );
                                    player.y = Math.max(
                                          50,
                                          Math.min(MAP_SIZE - 50, nextY)
                                    );
                              }
                        }

                        // Mouse Rotation
                        player.angle = Math.atan2(
                              mouse.y + camera.y - player.y,
                              mouse.x + camera.x - player.x
                        );

                        // Item Use
                        const currentItem = SLOT_MAP[player.itemIndex];
                        if (mouse.down) {
                              if (currentItem.type === "weapon") {
                                    if (!player.isAttacking)
                                          player.isAttacking = true;
                              } else if (currentItem.type === "consumable") {
                                    // Eat Food
                                    if (
                                          player.resources.food >= 1 &&
                                          player.hp < player.maxHp
                                    ) {
                                          player.resources.food--;
                                          player.hp = Math.min(
                                                player.maxHp,
                                                player.hp + currentItem.heal
                                          );
                                          createParticles(
                                                player.x,
                                                player.y,
                                                "#5e8544",
                                                5
                                          );
                                          mouse.down = false; // require click again
                                          updateHUD();
                                    }
                              } else if (currentItem.type === "building") {
                                    // Place Building
                                    const cost = currentItem.cost;
                                    if (
                                          player.resources.wood >= cost.wood &&
                                          player.resources.stone >= cost.stone
                                    ) {
                                          // Place location based on mouse
                                          let bx = mouse.x + camera.x;
                                          let by = mouse.y + camera.y;

                                          // Distance check from player
                                          if (
                                                Math.hypot(
                                                      bx - player.x,
                                                      by - player.y
                                                ) < 200
                                          ) {
                                                // Collision check
                                                let clear = true;
                                                [
                                                      ...objects,
                                                      ...buildings,
                                                      ...enemies,
                                                      player,
                                                ].forEach((o) => {
                                                      if (
                                                            Math.hypot(
                                                                  bx - o.x,
                                                                  by - o.y
                                                            ) <
                                                            o.radius +
                                                                  currentItem.radius
                                                      )
                                                            clear = false;
                                                });

                                                if (clear) {
                                                      player.resources.wood -=
                                                            cost.wood;
                                                      player.resources.stone -=
                                                            cost.stone;
                                                      buildings.push(
                                                            new Building(
                                                                  bx,
                                                                  by,
                                                                  player.id,
                                                                  currentItem,
                                                                  player.angle
                                                            )
                                                      );
                                                      mouse.down = false; // Prevent rapid fire
                                                      updateHUD();
                                                }
                                          }
                                    }
                              }
                        }

                        player.update(dt);

                        // --- Bots Update ---
                        enemies.forEach((bot) => bot.update(dt));
                        enemies = enemies.filter((e) => !e.markedForDeletion);
                        if (enemies.length < 5) enemies.push(new Bot()); // Respawn bots

                        // --- Buildings Update ---
                        buildings.forEach((b) => b.update(dt));
                        buildings = buildings.filter(
                              (b) => !b.markedForDeletion
                        );
                        objects = objects.filter((o) => !o.markedForDeletion);

                        // Respawn Trees/Rocks occasionally
                        if (objects.length < 70 && Math.random() < 0.02) {
                              let type =
                                    Math.random() < 0.5
                                          ? 0
                                          : Math.random() < 0.5
                                          ? 1
                                          : 2;
                              objects.push(
                                    new GameObject(
                                          Math.random() * MAP_SIZE,
                                          Math.random() * MAP_SIZE,
                                          type
                                    )
                              );
                        }

                        // --- Particles & Text ---
                        damageTexts.forEach((t) => {
                              t.y -= 10 * dt;
                              t.life -= dt;
                        });
                        damageTexts = damageTexts.filter((t) => t.life > 0);

                        particles.forEach((p) => {
                              p.x += p.vx;
                              p.y += p.vy;
                              p.life -= dt * 2;
                        });
                        particles = particles.filter((p) => p.life > 0);

                        // --- Camera ---
                        camera.x = player.x - width / 2;
                        camera.y = player.y - height / 2;

                        // Limit Camera
                        camera.x = Math.max(
                              0,
                              Math.min(MAP_SIZE - width, camera.x)
                        );
                        camera.y = Math.max(
                              0,
                              Math.min(MAP_SIZE - height, camera.y)
                        );

                        // Update UI Bars
                        const hpBar = document.getElementById("healthBar");
                        hpBar.style.width =
                              (player.hp / player.maxHp) * 100 + "%";

                        updateScoreboard();
                        draw();
                  }

                  function draw() {
                        // Clear Background (Grid)
                        ctx.fillStyle = "#b6db66";
                        ctx.fillRect(0, 0, width, height);

                        // Draw Grid
                        ctx.save();
                        ctx.translate(-camera.x, -camera.y);

                        ctx.strokeStyle = "rgba(0,0,0,0.05)";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let x = 0; x < MAP_SIZE; x += 100) {
                              ctx.moveTo(x, 0);
                              ctx.lineTo(x, MAP_SIZE);
                        }
                        for (let y = 0; y < MAP_SIZE; y += 100) {
                              ctx.moveTo(0, y);
                              ctx.lineTo(MAP_SIZE, y);
                        }
                        ctx.stroke();

                        // Draw World Boundary
                        ctx.strokeStyle = "#000";
                        ctx.lineWidth = 5;
                        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

                        // Z-Index: Floor Items -> Buildings -> Objects -> Players -> Flying

                        // Buildings
                        buildings.forEach((b) => b.draw(ctx));

                        // Objects (Trees/Rocks)
                        objects.forEach((o) => o.draw(ctx));

                        // Bots
                        enemies.forEach((e) => e.draw(ctx));

                        // Player
                        if (player && !player.markedForDeletion)
                              player.draw(ctx);

                        // Particles
                        particles.forEach((p) => {
                              ctx.fillStyle = p.color;
                              ctx.globalAlpha = p.life;
                              ctx.beginPath();
                              ctx.fillRect(p.x, p.y, 6, 6);
                              ctx.globalAlpha = 1;
                        });

                        // Damage Text
                        ctx.font = "bold 20px Fredoka One";
                        ctx.textAlign = "center";
                        damageTexts.forEach((t) => {
                              ctx.fillStyle = "black";
                              ctx.fillText(t.text, t.x + 2, t.y + 2);
                              ctx.fillStyle = t.color;
                              ctx.fillText(t.text, t.x, t.y);
                        });

                        ctx.restore();
                  }

                  function updateHUD() {
                        document.getElementById("woodCount").innerText =
                              player.resources.wood;
                        document.getElementById("stoneCount").innerText =
                              player.resources.stone;
                        document.getElementById("foodCount").innerText =
                              player.resources.food;
                  }

                  function updateScoreboard() {
                        const list = document.getElementById("scoreList");
                        let scores = enemies.map((e) => ({
                              name: e.name,
                              score: e.score,
                        }));
                        scores.push({ name: player.name, score: player.score });
                        scores.sort((a, b) => b.score - a.score);

                        list.innerHTML = scores
                              .slice(0, 5)
                              .map(
                                    (s, i) =>
                                          `<div class="score-entry">
                    <span style="color:${
                          s.name === player.name ? "#ffd700" : "white"
                    }">${i + 1}. ${s.name}</span>
                    <span>${Math.floor(s.score)}</span>
                 </div>`
                              )
                              .join("");
                  }

                  // --- Event Listeners ---
                  window.addEventListener("keydown", (e) => {
                        keys[e.key.toLowerCase()] = true;
                        if (e.key >= "1" && e.key <= "5")
                              selectItem(parseInt(e.key) - 1);
                  });
                  window.addEventListener(
                        "keyup",
                        (e) => (keys[e.key.toLowerCase()] = false)
                  );
                  window.addEventListener("mousemove", (e) => {
                        mouse.x = e.clientX;
                        mouse.y = e.clientY;
                  });
                  window.addEventListener(
                        "mousedown",
                        () => (mouse.down = true)
                  );
                  window.addEventListener(
                        "mouseup",
                        () => (mouse.down = false)
                  );
            </script>
      </body>
</html>
