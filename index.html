<!DOCTYPE html>
<html lang="es">
      <head>
            <meta charset="UTF-8" />
            <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
            />
            <title>Gatoso.io</title>
            <link rel="stylesheet" href="src/ui/styles/styles.css" />
      </head>
      <body>
            <canvas id="gameCanvas"></canvas>

            <div id="uiLayer">
                  <!-- Start Screen -->
                  <div id="startScreen">
                        <div class="login-box">
                              <h2>GatosoIO</h2>
                              <input
                                    type="text"
                                    id="nickname"
                                    placeholder="Nickname"
                                    maxlength="12"
                              />
                              <button class="btn" onclick="startGame()">
                                    Enter Game
                              </button>
                              <p
                                    style="
                                          font-size: 12px;
                                          color: #888;
                                          margin-top: 10px;
                                    "
                              >
                                    WASD to Move, Click to Attack/Build<br />1-5
                                    to Select Items
                              </p>
                        </div>
                  </div>

                  <!-- Death Screen -->
                  <div id="deathScreen">
                        <h1>YOU DIED</h1>
                        <p id="finalScore">Score: 0</p>
                        <button
                              class="btn"
                              style="width: 200px"
                              onclick="location.reload()"
                        >
                              Respawn
                        </button>
                  </div>

                  <!-- Resources -->
                  <div id="resources">
                        <div class="res-box">
                              <div
                                    class="res-icon"
                                    style="background: #e0bb6b"
                              ></div>
                              <span id="woodCount">0</span>
                        </div>
                        <div class="res-box">
                              <div
                                    class="res-icon"
                                    style="background: #888"
                              ></div>
                              <span id="stoneCount">0</span>
                        </div>
                        <div class="res-box">
                              <div
                                    class="res-icon"
                                    style="background: #eebb33"
                              ></div>
                              <span id="foodCount">0</span>
                        </div>
                  </div>

                  <!-- Scoreboard -->
                  <div id="scoreBoard">
                        <div
                              style="
                                    text-align: center;
                                    margin-bottom: 5px;
                                    color: #ddd;
                              "
                        >
                              Leaderboard
                        </div>
                        <div id="scoreList"></div>
                  </div>

                  <!-- Health Bar -->
                  <div id="stats">
                        <div id="healthBar"></div>
                  </div>

                  <!-- Action Bar -->
                  <div id="actionBar">
                        <!-- Generated by JS -->
                  </div>
            </div>

            <script src="main.js"></script>
      </body>
</html>
